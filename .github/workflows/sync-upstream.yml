name: Sync fork with upstream

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync default branch with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          before=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq .commit.sha)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f "branch=${branch}"
          after=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq .commit.sha)
          if [ "$before" = "$after" ]; then
            echo "No upstream changes."
            exit 0
          fi
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq '.[] | select(.title == "上游同步通知（自动）") | .number' | head -n 1)
          body=$(printf '%s\n' '@Joker2021 检测到上游更新，已完成同步。' '' "- 仓库：${GITHUB_REPOSITORY}" "- 分支：${branch}" "- 变更：${before:0:7} → ${after:0:7}" "- 工作流：[查看运行记录](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "上游同步通知（自动）" --body "$body"
          fi
